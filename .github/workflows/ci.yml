name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Unit + API tests use a hashing embedder and a lexical reranker,
      # so CI never downloads model weights or needs a GPU.
      - name: Install
        run: |
          pip install -e ".[dev,nlp]"
          python -m spacy download en_core_web_sm
      - name: Lint
        run: |
          ruff check src tests eval scripts space
          ruff format --check src tests eval scripts space
      - name: Test
        run: pytest -q

  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragmap
          POSTGRES_PASSWORD: ragmap
          POSTGRES_DB: ragmap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ragmap" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,pgvector]"
      - run: pytest -q tests/test_pgvector.py
        env:
          RAGMAP_TEST_PG_DSN: postgresql://ragmap:ragmap@localhost:5432/ragmap
