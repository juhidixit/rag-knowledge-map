[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragmap"
version = "0.1.0"
description = "Hybrid-retrieval RAG engine that turns PDFs into interactive, source-linked knowledge maps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juhi Dixit" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "networkx>=3.2",
  "pymupdf>=1.24",
  "faiss-cpu>=1.8",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.0", "torch>=2.2"]
llm = ["anthropic>=0.70"]
nlp = ["spacy>=3.7", "wordfreq>=3.0"]
pgvector = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
ragmap = "ragmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragmap = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
