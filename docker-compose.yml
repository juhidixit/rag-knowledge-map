services:
  ragmap:
    build: .
    ports: ["8000:8000"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}   # optional: enables cited LLM answers
    volumes:
      - ./library:/app/library:ro                  # drop PDFs here to index them at startup

  # Optional: run the vector index in Postgres instead of in-process FAISS.
  #   docker compose --profile pgvector up
  #   and set RAGMAP_VECTOR_STORE=pgvector RAGMAP_PG_DSN=postgresql://ragmap:ragmap@pgvector/ragmap
  pgvector:
    profiles: ["pgvector"]
    image: pgvector/pgvector:pg16
    environment: [POSTGRES_USER=ragmap, POSTGRES_PASSWORD=ragmap, POSTGRES_DB=ragmap]
    ports: ["5432:5432"]
